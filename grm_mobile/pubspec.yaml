name: grm_repair
description: "GRM Repair Service mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  http: ^1.6.0
  provider: ^6.1.5+1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/grm-logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/grm-icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/grm-icon.png"